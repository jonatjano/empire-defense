<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
	      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<link rel="stylesheet" href="style.css">
	<title data-translation="generic.title">Title</title>
	<script type="module">
		import "/src/utils/Options.js"
		import {lobby} from "/src/view/Menu.js"
		screen.orientation.lock('landscape').catch(() => {})
		lobby()
	</script>
</head>
<body>
	<div id="lobby" class="hidden">
		<h1 style="grid-area: title" data-translation="generic.title">Title</h1>
		<h2 id="mapName"></h2>
		<canvas id="mapPreview" height="900" width="1600"></canvas>
		<div id="buttons">
			<button id="lobbyPrevMapButton">&lt;</button>
			<button id="lobbyNextMapButton">&gt;</button>
			<button id="lobbyStartButton" data-translation="generic.play">Play</button>
		</div>
	</div>
	<div id="game" class="hidden">
		<canvas id="gameCanvas" height="900" width="1600"></canvas>
		<div id="gui">
			<div id="money"><img data-texture="icons/money" src="" alt="Money"><span id="moneyLabel">0</span></div>
			<div id="life"><img data-texture="icons/life" src="" alt="Life"><span id="lifeLabel">0</span></div>
			<div id="crystal"><img data-texture="icons/crystal" src="" alt="Crystal"><span id="crystalLabel">0</span></div>
			<div id="wave"><img data-texture="icons/wave" src="" alt="Wave"><span id="waveLabel">0</span></div>
			<div id="menu">
				<button id="option"><img data-texture="icons/option" src="" alt="Option"></button>
				<button id="speed"><img data-texture="icons/speed1" src="" alt="Speed x1"></button>
				<button id="zoomOut"><img data-texture="icons/zoomOut" src="" alt="Zoom out"></button>
				<button id="zoomIn"><img data-texture="icons/zoomIn" src="" alt="Zoom in"></button>
			</div>
			<div id="towers"></div>
		</div>
		<div id="pauseMenu" class="menu">
			<h1 data-translation="generic.menu">Menu</h1>
			<button id="resumeButton" data-translation="generic.resume">Resume</button>
			<button id="optionButton" data-translation="generic.options">Options</button>
			<button id="creditsButton" data-translation="generic.credits">Credits</button>
			<button id="quitButton" data-translation="generic.quit">Quit</button>
		</div>
		<div id="towerMenu" class="hidden">
			<button id="upgradeTower"><img data-framed="true" data-texture="entities/buildings/archery1" src="" alt="Upgrade"></button>
			<button id="sellTower"><img data-framed="true" data-texture="icons/money" src="" alt="Sell"></button>
		</div>
		<div id="optionMenu" class="menu hidden">
			<h1 data-translation="generic.options">Options</h1>
			<div id="texturePackOption">
				<h3 data-translation="generic.texturePacks">Texture packs</h3>
				<select id="texturePackSelect"></select>
				<input id="texturePackInput" type="file" webkitdirectory onchange="options.uploadTexturePack()"/>
			</div>
			<div id="languageOption">
				<h3 data-translation="option.language">Language</h3>
				<select id="languageSelect"></select>
			</div>
			<div id="otherOption">
				<input id="showStatsCheckbox" type="checkbox"/>
				<label for="showStatsCheckbox" data-translation="option.showStats"></label>
			</div>
			<button id="saveOptionButton" data-translation="generic.save">Save</button>
		</div>
		<div id="creditsMenu" class="menu hidden">
			<div style="overflow: auto">
				<h1 data-translation="generic.credits">Credits</h1>
				<h2 data-translation="credits.programmation">Programmation</h2>
				<h4>Jonathan Selle</h4>
				<h2 data-translation="credits.arts">Arts</h2>
				<h4>Tom Hequet</h4>
				<h4>Jonathan Selle</h4>
				<h2 data-translation="credits.goodgamestudio1">All reserved rights to GoodGame Studio</h2>
				<h4 data-translation="credits.goodgamestudio2">Special thanks for creating the base game</h4>
				<a href="https://github.com/jonatjano/empire-defense" target="_blank"><h4 data-translation="credits.github">Game code is available on GitHub</h4></a>
			</div>
			<button id="leaveCreditsButton" data-translation="generic.quit">Quit</button>
		</div>
	</div>
	<div id="debugOverlay" class="hidden">
		<p>time: <span id="debugTime"></span> (frames: <span id="frameCount"></span>)</p>
		<p>fps: <span id="debugFps"></span> (avg: <span id="debugFpsAvg"></span>)</p>
		<p>entities: <span id="entityCount"></span></p>
	</div>
	<div id="textures" class="hidden">
		<h1>Textures</h1>
	</div>

	<!-- TOOO maybe replace by an OffScreenCanvas -->
	<!-- this canvas is used by background scripts -->
	<canvas id="utilsCanvas" class="hidden" style="position: absolute; bottom: 0; left: 0"></canvas>

	<!-- TODO for debug purpose, should be removed before release -->
	<button style="position: absolute; top: 0; left: 0" onclick="window.location.reload()">reload</button>
</body>
</html>
